; Hanukkiah "Galei HaAliyah" - ESP32-S3 SuperMini firmware
; Open this folder in VS Code with the PlatformIO extension, then Build / Upload.

[env:esp32s3_supermini]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 SuperMini: 4 MB flash, native USB (USB-C) for upload + serial
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    fastled/FastLED@3.9.4
    h2zero/NimBLE-Arduino@1.4.3
